name: Construir ejecutables
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            nombre: PSD_Reportabilidad_Mac_AppleSilicon
          - os: windows-latest
            nombre: PSD_Reportabilidad_Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --windowed --noconfirm --name PSD_Reportabilidad psd_app.py
      - name: Comprimir (Mac)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry ../${{ matrix.nombre }}.zip PSD_Reportabilidad.app
      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/PSD_Reportabilidad -DestinationPath ${{ matrix.nombre }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}.zip
  publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: descargas
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versión ${{ github.run_number }}
          files: descargas/*.zip
