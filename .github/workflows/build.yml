name: Construir ejecutables
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Mac con chip Apple (M1/M2/M3/M4)
            nombre: PSD_Reportabilidad_Mac_AppleSilicon
          - os: macos-13      # Mac con procesador Intel
            nombre: PSD_Reportabilidad_Mac_Intel
          - os: windows-latest
            nombre: PSD_Reportabilidad_Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --windowed --noconfirm --name PSD_Reportabilidad psd_app.py
      - name: Comprimir (Mac)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry ../${{ matrix.nombre }}.zip PSD_Reportabilidad.app
      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/PSD_Reportabilidad -DestinationPath ${{ matrix.nombre }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}.zip
